services:
  # start the redis server
  redis:
    image: "redis:7.0-alpine"
    restart: always
    mem_limit: 256m
    memswap_limit: 256m
    command: redis-server --maxmemory-policy volatile-lru --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
  
  # start the web app
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: always
    mem_limit: 512m
    cpus: '0.5'
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8080
      --workers 1
      --proxy-headers
      --forwarded-allow-ips="*"
      --no-access-log
    # ports: - "80:8080" only cloudflare tunnel needs access to this docker network
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    depends_on:
      redis:
        condition: service_healthy
  
  # celery worker setup
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: always
    mem_limit: 1800m
    memswap_limit: 1800m
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1800M
        reservations:
          memory: 512M
    command: /app/start_worker.sh
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    depends_on:
      redis:
        condition: service_healthy

  # clouflare tunnel 
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    mem_limit: 128m
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN} 
    depends_on:
      - web
